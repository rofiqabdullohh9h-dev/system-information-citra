[build]
  command = "npm --prefix backend install --include=dev && npm --prefix frontend install --include=dev && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "backend/.env.example"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
